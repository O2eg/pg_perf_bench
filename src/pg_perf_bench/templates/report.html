<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <style id="highlight-theme">__HIGHLIGHT_CSS__</style>
  <style>
    :root {
      color-scheme: dark;
      --bg: #17111f;
      --panel: #241a2d;
      --panel-soft: #2e2239;
      --line: #463456;
      --line-strong: #725a87;
      --text: #f8f0ff;
      --muted: #d8c8e8;
      --header: #120c19;
      --header-fg: #fff7d6;
      --header-muted: #eadfb7;
      --input-bg: #1d1526;
      --button-bg: #2b2035;
      --button-hover-bg: #392847;
      --button-hover-border: #d6b35f;
      --summary-bg: #2a1f34;
      --section-summary-bg: #3a2748;
      --section-summary-fg: #fff7d6;
      --item-summary-bg: #281d32;
      --item-summary-open-bg: #f3d46b;
      --item-summary-open-fg: #24152f;
      --table-head-bg: #342643;
      --row-alt-bg: #1d1626;
      --accent: #f3d46b;
      --accent-soft: #483a1f;
      --accent-fg: #ffeaa3;
      --accent-contrast: #24152f;
      --code-bg: #0d1117;
      --code-fg: #c9d1d9;
      --shadow: 0 10px 30px rgb(0 0 0 / 22%);
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #fbf7ff;
      --panel: #ffffff;
      --panel-soft: #f4edfb;
      --line: #dfd2ec;
      --line-strong: #c9b3df;
      --text: #2b1d38;
      --muted: #746286;
      --header: #ede1f7;
      --header-fg: #2a1738;
      --header-muted: #6c5b80;
      --input-bg: #fffdf7;
      --button-bg: #fffaf0;
      --button-hover-bg: #f6ecff;
      --button-hover-border: #b98bd6;
      --summary-bg: #f6effc;
      --section-summary-bg: #eadbf6;
      --section-summary-fg: #2a1738;
      --item-summary-bg: #fffaf0;
      --item-summary-open-bg: #f4cf6a;
      --item-summary-open-fg: #2a1738;
      --table-head-bg: #efe2f8;
      --row-alt-bg: #fffaf0;
      --accent: #f4cf6a;
      --accent-soft: #fff0ba;
      --accent-fg: #62490f;
      --accent-contrast: #2a1738;
      --code-bg: #f6f8fa;
      --code-fg: #24292f;
      --shadow: 0 10px 30px rgb(70 42 90 / 12%);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    a { color: var(--accent-fg); }
    .shell {
      width: min(100%, 1480px);
      margin: 0 auto;
      padding: 0 28px;
      transition: padding-left 300ms ease;
    }
    @media (min-width: 1180px) {
      .shell { padding-left: 278px; }
      body.nav-collapsed .shell { padding-left: 80px; }
    }

    .app-header {
      position: relative;
      background: var(--header);
      border-bottom: 1px solid var(--line);
      color: var(--header-fg);
    }
    .app-header .shell { padding-top: 20px; padding-bottom: 18px; }
    h1 { margin: 0 0 2px; font-size: 25px; line-height: 1.2; }
    .report-name {
      margin: 0 0 6px;
      color: var(--header-muted);
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35;
    }
    .runtime {
      color: var(--header-muted);
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .runtime + .runtime { margin-top: 4px; }
    .project-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      font-family: inherit;
    }
    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--header-muted);
      text-decoration: none;
    }
    .project-link:hover,
    .project-link:focus-visible {
      color: var(--header-fg);
      text-decoration: underline;
      outline: none;
    }
    .project-link svg {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .report-nav {
      position: fixed;
      z-index: 20;
      inset: 0 auto 0 0;
      width: 244px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--panel);
      border-right: 1px solid var(--line);
      border-top: 1px solid var(--line);
      border-radius: 0 8px 0 0;
      box-shadow: 0 14px 38px rgb(0 0 0 / 24%);
      overflow: hidden;
      transition: width 300ms ease, box-shadow 300ms ease;
    }
    .nav-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 11px;
      background: var(--section-summary-bg);
      border-bottom: 1px solid var(--line);
      color: var(--section-summary-fg);
      font-size: 13px;
      font-weight: 700;
      transition: padding 300ms ease, gap 300ms ease;
    }
    .nav-title-text {
      min-width: 0;
      max-width: 160px;
      overflow: hidden;
      white-space: nowrap;
      opacity: 1;
      transition: max-width 300ms ease, opacity 180ms ease, transform 300ms ease;
    }
    .nav-toggle {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: rgb(255 255 255 / 4%);
      color: var(--section-summary-fg);
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
    }
    .nav-toggle:hover,
    .nav-toggle:focus-visible {
      border-color: var(--accent);
      background: var(--button-hover-bg);
      outline: none;
    }
    .nav-toggle::before {
      content: "";
      width: 8px;
      height: 8px;
      border: solid currentColor;
      border-width: 0 2px 2px 0;
      transform: rotate(135deg);
      transition: transform 300ms ease;
    }
    .nav-tree {
      min-width: 0;
      overflow: auto;
      padding: 7px;
      opacity: 1;
      transition: opacity 180ms ease;
    }
    .nav-section {
      display: grid;
      gap: 3px;
      margin-bottom: 6px;
    }
    .nav-tree a {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 30px;
      padding: 5px 7px;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-tree a:hover,
    .nav-tree a:focus-visible {
      border-color: var(--line-strong);
      background: var(--button-hover-bg);
      outline: none;
    }
    .nav-section > a {
      color: var(--section-summary-fg);
      font-weight: 700;
    }
    .nav-items {
      display: grid;
      gap: 3px;
      min-width: 0;
    }
    .nav-items a {
      padding-left: 20px;
      color: var(--muted);
      font-size: 13px;
    }
    body.nav-collapsed .report-nav {
      width: 46px;
      box-shadow: 0 10px 28px rgb(0 0 0 / 18%);
    }
    body.nav-collapsed .nav-title {
      justify-content: center;
      gap: 0;
      padding: 7px;
    }
    body.nav-collapsed .nav-title-text {
      max-width: 0;
      opacity: 0;
      transform: translateX(-6px);
    }
    body.nav-collapsed .nav-tree {
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }
    body.nav-collapsed .nav-toggle::before { transform: rotate(-45deg); }

    main.shell { padding-top: 22px; padding-bottom: 42px; }
    .report-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1.2fr) minmax(120px, 180px);
      gap: 10px;
      align-items: end;
      margin-bottom: 10px;
    }
    .filter-summary-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 34px;
      margin-bottom: 16px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .filter-summary-actions {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-self: start;
      min-width: 0;
    }
    .filter-summary-spacer { justify-self: end; }
    #filterSummary {
      justify-self: center;
      text-align: center;
    }
    .field { display: grid; gap: 4px; min-width: 0; }
    .field span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .input, .select, .button {
      min-height: 34px;
      color: var(--text);
      background: var(--input-bg);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
    }
    .input, .select { width: 100%; padding: 6px 9px; }
    .button {
      padding: 6px 11px;
      cursor: pointer;
      background: var(--button-bg);
      white-space: nowrap;
    }
    .button:hover {
      background: var(--button-hover-bg);
      border-color: var(--button-hover-border);
    }
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .header-theme-toggle {
      position: absolute;
      top: 18px;
      right: max(18px, env(safe-area-inset-right));
      z-index: 2;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgb(255 255 255 / 4%);
    }
    .theme-toggle input {
      appearance: none;
      position: relative;
      width: 42px;
      height: 22px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--button-bg);
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .theme-toggle input::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 120ms ease, background 120ms ease;
    }
    .theme-toggle input:checked {
      border-color: var(--accent);
      background: var(--accent);
    }
    .theme-toggle input:checked::before {
      transform: translateX(20px);
      background: var(--header-fg);
    }
    details.section, details.report-item {
      overflow: clip;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    details.section { margin-bottom: 16px; }
    details.report-item { margin: 10px 0; box-shadow: none; }
    summary { list-style: none; cursor: pointer; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "›"; display: inline-block; margin-right: 9px; transition: transform 300ms ease; }
    details[open] > summary::before { transform: rotate(90deg); }
    details.is-closing > summary::before { transform: rotate(0deg); }
    .details-content {
      display: grid;
      grid-template-rows: 1fr;
      min-width: 0;
      overflow: clip;
      opacity: 1;
      transition: grid-template-rows 300ms ease, opacity 220ms ease;
    }
    .details-content-inner {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    details.is-opening > .details-content,
    details.is-closing > .details-content {
      grid-template-rows: 0fr;
      opacity: 0;
    }
    details[open]:not(.is-opening):not(.is-closing) > .details-content {
      grid-template-rows: 1fr;
      overflow: visible;
      opacity: 1;
    }
    details[open]:not(.is-opening):not(.is-closing) > .details-content > .details-content-inner {
      overflow: visible;
    }
    details.section[open]:not(.is-opening):not(.is-closing),
    details.report-item[open]:not(.is-opening):not(.is-closing) {
      overflow: visible;
    }
    .section-summary {
      padding: 14px 16px;
      color: var(--section-summary-fg);
      background: var(--section-summary-bg);
      font-size: 17px;
      font-weight: 750;
    }
    .section-content { padding: 2px 14px 14px; }
    .section-description { margin: 12px 2px; color: var(--muted); white-space: pre-wrap; }
    .item-summary {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 11px 13px;
      background: var(--item-summary-bg);
      font-weight: 680;
    }
    details.report-item[open] > .item-summary { color: var(--item-summary-open-fg); background: var(--item-summary-open-bg); }
    details.report-item.is-closing > .item-summary {
      color: var(--text);
      background: var(--item-summary-bg);
    }
    .item-summary::before { flex: 0 0 auto; }
    .item-title { flex: 1; }
    .badge {
      padding: 2px 7px;
      color: var(--muted);
      background: var(--summary-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 650;
    }
    details.report-item[open] .badge { color: var(--item-summary-open-fg); border-color: rgb(36 21 47 / 28%); background: rgb(255 255 255 / 25%); }
    .item-body { padding: 14px; border-top: 1px solid var(--line); }
    .item-description { margin: 0 0 12px; color: var(--muted); white-space: pre-wrap; }
    .comparison-label { margin: 16px 0 7px; color: var(--accent-fg); font-weight: 700; }
    .comparison-label:first-child { margin-top: 0; }
    .empty { padding: 18px; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 8px; }
    .plain-output {
      max-height: 620px;
      margin: 0;
      padding: 14px;
      overflow: auto;
      color: var(--code-fg);
      background: var(--code-bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .table-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 0 0 9px; }
    .table-tools .field { min-width: 120px; }
    .table-tools .table-search { flex: 1 1 230px; }
    .table-meta { margin-left: auto; padding-bottom: 8px; color: var(--muted); font-size: 13px; }
    .table-wrap {
      width: 100%;
      max-width: 100%;
      max-height: 72vh;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: auto;
      font-size: inherit;
    }
    th, td { padding: 7px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th:last-child, td:last-child { border-right: 0; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:nth-child(even) { background: var(--row-alt-bg); }
    tbody tr:hover { background: var(--panel-soft); }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: var(--text);
      background: var(--table-head-bg);
      white-space: nowrap;
    }
    .sort-button {
      all: unset;
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 34px;
      cursor: pointer;
      font-weight: 700;
    }
    .sort-mark { color: var(--accent-fg); }
    td { max-width: 520px; overflow-wrap: normal; }
    .cell-content {
      --cell-line-height: 1.35;
      --cell-collapsed-lines: 6;
      max-height: calc(var(--cell-collapsed-lines) * var(--cell-line-height) * 1em);
      overflow: hidden;
      line-height: var(--cell-line-height);
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: normal;
    }
    .cell-content.expanded { max-height: none; }
    .json-cell {
      margin: 0;
      font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }
    .button.ghost { background: transparent; }
    .cell-toggle {
      min-height: 26px;
      margin-top: 5px;
      padding: 3px 7px;
      font-size: 12px;
    }
    .pagination { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 9px; }
    .page-label { color: var(--muted); font-size: 13px; }

    .chart-stack { display: grid; gap: 18px; }
    .chart-block { display: grid; gap: 8px; }
    .chart-meta { color: var(--muted); font-size: 12px; }
    .chart-fallback { margin-top: 10px; }
    .chart-shell {
      position: relative;
      min-width: 0;
      padding: 12px;
      overflow: visible;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
    }
    .echarts-chart {
      box-sizing: border-box;
      width: 100%;
      height: 470px;
      min-height: 470px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--input-bg);
    }
    .chart-legend-panel {
      box-sizing: border-box;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 5px 14px;
      width: 100%;
      max-height: 160px;
      margin-top: 8px;
      padding: 8px 10px;
      overflow-x: hidden;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--input-bg);
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) var(--panel-soft);
      overscroll-behavior: contain;
    }
    .chart-legend-item {
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
      min-height: 19px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: transparent;
      color: var(--text);
      font: 12px/19px ui-sans-serif, system-ui, sans-serif;
      text-align: left;
      cursor: pointer;
    }
    .chart-legend-item[aria-pressed="false"] { opacity: 0.42; }
    .chart-legend-item:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 2px;
    }
    .chart-legend-marker {
      flex: 0 0 auto;
      width: 20px;
      height: 10px;
      border-radius: 2px;
    }
    .chart-legend-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chart-export-menu[hidden] { display: none; }
    .chart-export-menu {
      position: absolute;
      z-index: 20;
      top: 50px;
      right: 24px;
      display: grid;
      min-width: 138px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--panel);
      box-shadow: 0 12px 30px rgb(0 0 0 / 34%);
    }
    .chart-export-menu button {
      appearance: none;
      padding: 9px 12px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .chart-export-menu button:last-child { border-bottom: 0; }
    .chart-export-menu button:hover,
    .chart-export-menu button:focus-visible {
      background: var(--button-hover-bg);
      outline: none;
    }
    .pg-diag-echarts-tooltip {
      z-index: 60 !important;
      overflow: hidden !important;
      border: 1px solid var(--line) !important;
      border-radius: 6px !important;
      background: var(--panel) !important;
      color: var(--text) !important;
      box-shadow: 0 12px 30px rgb(0 0 0 / 32%) !important;
      pointer-events: auto !important;
    }
    .pg-diag-chart-tooltip {
      box-sizing: border-box;
      min-width: 260px;
      max-width: min(520px, 70vw);
      color: var(--text);
      font-size: 12px;
      line-height: 1.35;
    }
    .pg-diag-chart-tooltip-title {
      padding: 9px 11px;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .pg-diag-chart-tooltip-rows {
      max-height: 360px;
      padding: 5px 0;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .pg-diag-chart-tooltip-row {
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr) max-content;
      gap: 7px;
      align-items: center;
      padding: 4px 10px;
    }
    .pg-diag-chart-tooltip-marker {
      width: 9px;
      height: 9px;
      border-radius: 2px;
    }
    .pg-diag-chart-tooltip-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pg-diag-chart-tooltip-value {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
    .link-list { display: grid; gap: 8px; }
    .link-card { display: grid; gap: 3px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-soft); }
    .link-label { color: var(--muted); font-size: 12px; }
    .page-scroll-controls {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 35;
      display: grid;
      gap: 10px;
      pointer-events: none;
    }
    .scroll-jump {
      position: relative;
      width: 46px;
      height: 46px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-contrast);
      box-shadow: 0 10px 28px rgb(0 0 0 / 28%);
      cursor: pointer;
      opacity: 0;
      transform: translateY(12px) scale(0.92);
      transition:
        opacity 220ms ease,
        transform 220ms ease,
        background-color 160ms ease,
        border-color 160ms ease;
      pointer-events: none;
    }
    .scroll-jump.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .scroll-jump:hover {
      border-color: var(--accent);
      background: var(--header-fg);
    }
    .scroll-jump:focus-visible {
      outline: 2px solid var(--header-fg);
      outline-offset: 3px;
    }
    .scroll-jump::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      border-left: 3px solid currentColor;
      border-top: 3px solid currentColor;
    }
    .scroll-jump.scroll-up::before {
      transform: translate(-50%, -35%) rotate(45deg);
    }
    .scroll-jump.scroll-down::before {
      transform: translate(-50%, -65%) rotate(225deg);
    }
    html[data-theme="light"] .scroll-jump {
      border-color: #bba3d0;
      background: #ffffff;
      color: #5d3978;
      box-shadow: 0 6px 18px rgb(63 38 82 / 18%);
    }
    html[data-theme="light"] .scroll-jump:hover {
      border-color: #7a4da0;
      background: #eadbf6;
      color: #2a1738;
    }
    html[data-theme="light"] .scroll-jump:focus-visible {
      outline-color: #7a4da0;
    }
    .hidden { display: none !important; }

    @media (max-width: 1179px) {
      .report-nav { display: none; }
      .shell { padding-left: 18px; padding-right: 18px; }
    }
    @media (max-width: 840px) {
      .report-toolbar {
        grid-template-columns: 1fr;
      }
      .filter-summary-panel {
        grid-template-columns: 1fr;
      }
      .filter-summary-actions,
      .filter-summary-spacer,
      #filterSummary {
        justify-self: center;
      }
      .page-scroll-controls {
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
      }
      .scroll-jump {
        width: 42px;
        height: 42px;
      }
    }
    @media (max-width: 640px) {
      .shell { padding-left: 10px; padding-right: 10px; }
      .table-meta { width: 100%; margin-left: 0; }
      .header-theme-toggle {
        position: static;
        width: max-content;
        margin: 10px 0 0;
      }
      .echarts-chart { height: 390px; min-height: 390px; }
    }
    @media print {
      .report-nav, .report-toolbar, .filter-summary-panel, .pagination, .table-tools, .page-scroll-controls { display: none !important; }
      .shell { width: 100%; padding: 0; }
      details { break-inside: avoid; }
      details > * { display: block !important; }
      .chart-shell { break-inside: avoid; }
    }
    @media (prefers-reduced-motion: reduce) {
      details.section,
      details.section > summary,
      details.report-item,
      details.report-item > summary,
      summary::before,
      .details-content,
      .shell,
      .report-nav,
      .nav-title,
      .nav-title-text,
      .nav-toggle::before,
      .nav-tree,
      .scroll-jump {
        transition: none !important;
      }
    }
  </style>
  <script>__ECHARTS_JS__</script>
</head>

  <script>__HIGHLIGHT_JS__</script>
  <script>
    (() => {
      'use strict';

      const report = JSON.parse(document.getElementById('pg-perf-bench-report').textContent);
      Object.values(report.sections || {}).forEach(section => {
        if (section && typeof section.header === 'string') {
          section.header = section.header.replace(/\s*<hn>\s*/gi, '').trim();
        }
      });
      const content = document.getElementById('reportContent');
      const navTree = document.getElementById('navTree');
      const charts = [];
      const CHART_MIN_HEIGHT_PX = 470;
      const CHART_PLOT_MIN_HEIGHT_PX = 330;
      const CHART_LEGEND_ROW_HEIGHT_PX = 24;
      const CHART_LEGEND_PADDING_PX = 18;
      const DETAILS_ANIMATION_MS = 300;
      let activeChartPanEntry = null;
      let renderedItems = 0;
      let scrollControlsRaf = 0;

      const asText = value => {
        if (value === null || value === undefined) return '';
        if (typeof value === 'string') return value;
        if (typeof value === 'object') return JSON.stringify(value, null, 2);
        return String(value);
      };

      const slug = value => String(value)
        .toLowerCase()
        .replace(/[^a-z0-9_-]+/g, '-')
        .replace(/^-+|-+$/g, '') || 'item';

      const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };
      const wrapDetailsContent = contentNode => {
        const shell = element('div', 'details-content');
        const inner = element('div', 'details-content-inner');
        inner.append(contentNode);
        shell.append(inner);
        return shell;
      };

      const addLabeledBlock = (parent, label, value) => {
        if (label) parent.append(element('div', 'comparison-label', label));
        const pre = element('pre', 'plain-output');
        const code = element('code', 'language-plaintext', asText(value));
        pre.append(code);
        parent.append(pre);
      };

      const comparisonData = data => (
        Array.isArray(data)
        && data.length > 0
        && data.every(item => Array.isArray(item) && item.length >= 2 && typeof item[0] === 'string')
      );

      const renderPlainText = (parent, data) => {
        if (comparisonData(data)) {
          data.forEach(item => addLabeledBlock(parent, item[0], item[1]));
        } else {
          addLabeledBlock(parent, '', data);
        }
      };

      const renderLinks = (parent, data) => {
        const list = element('div', 'link-list');
        const items = comparisonData(data) ? data : [['', data]];
        items.forEach(([label, rawUrl]) => {
          const card = element('div', 'link-card');
          if (label) card.append(element('div', 'link-label', label));
          const url = asText(rawUrl);
          const anchor = element('a', '', url || 'Empty link');
          if (/^(https?:|file:)/i.test(url)) {
            anchor.href = url;
            anchor.target = '_blank';
            anchor.rel = 'noopener noreferrer';
          } else {
            anchor.href = url;
          }
          card.append(anchor);
          list.append(card);
        });
        parent.append(list);
      };

      const compareValues = (left, right) => {
        const leftNumber = Number(left);
        const rightNumber = Number(right);
        if (left !== '' && right !== '' && Number.isFinite(leftNumber) && Number.isFinite(rightNumber)) {
          return leftNumber - rightNumber;
        }
        return asText(left).localeCompare(asText(right), undefined, {numeric: true, sensitivity: 'base'});
      };
      const renderTableCell = value => {
        const td = element('td');
        const text = asText(value);
        const isComplex = value !== null && typeof value === 'object';
        const content = element(
          isComplex ? 'pre' : 'div',
          isComplex ? 'json-cell cell-content' : 'cell-content',
          text,
        );
        td.append(content);
        const likelyOverflow = text.split(/\r?\n/).length > 6 || text.length > 240;
        if (likelyOverflow) {
          const toggle = element('button', 'button ghost cell-toggle', 'Show more');
          toggle.type = 'button';
          toggle.addEventListener('click', () => {
            const expanded = content.classList.toggle('expanded');
            toggle.textContent = expanded ? 'Show less' : 'Show more';
            requestPageScrollControlsUpdate();
          });
          td.append(toggle);
        } else {
          content.classList.add('expanded');
        }
        return td;
      };

      const renderTable = (parent, headers, rows) => {
        if (!Array.isArray(rows) || rows.length === 0) {
          parent.append(element('div', 'empty', 'Empty result'));
          return;
        }

        const normalizedRows = rows.map(row => Array.isArray(row) ? row : [row]);
        const columnCount = Math.max(
          Array.isArray(headers) ? headers.length : 0,
          ...normalizedRows.map(row => row.length),
        );
        const normalizedHeaders = Array.from(
          {length: columnCount},
          (_, index) => (Array.isArray(headers) && headers[index] !== undefined)
            ? asText(headers[index])
            : `Column ${index + 1}`,
        );
        const state = {query: '', page: 1, pageSize: 25, sortColumn: null, sortDirection: 1};
        const root = element('div', 'table-view');
        const tools = element('div', 'table-tools');
        const searchLabel = element('label', 'field table-search');
        searchLabel.append(element('span', '', 'Filter rows'));
        const search = element('input', 'input');
        search.type = 'search';
        search.placeholder = 'Search in this table';
        searchLabel.append(search);
        tools.append(searchLabel);

        const sizeLabel = element('label', 'field');
        sizeLabel.append(element('span', '', 'Rows per page'));
        const size = element('select', 'select');
        [25, 50, 100, 250].forEach(value => {
          const option = element('option', '', value);
          option.value = value;
          size.append(option);
        });
        sizeLabel.append(size);
        tools.append(sizeLabel);
        const meta = element('div', 'table-meta');
        tools.append(meta);
        root.append(tools);

        const wrap = element('div', 'table-wrap');
        const table = element('table');
        const thead = element('thead');
        const headRow = element('tr');
        normalizedHeaders.forEach((header, columnIndex) => {
          const th = element('th');
          const button = element('button', 'sort-button');
          button.type = 'button';
          button.append(element('span', '', header));
          const mark = element('span', 'sort-mark');
          button.append(mark);
          button.addEventListener('click', () => {
            if (state.sortColumn === columnIndex) state.sortDirection *= -1;
            else {
              state.sortColumn = columnIndex;
              state.sortDirection = 1;
            }
            state.page = 1;
            draw();
          });
          th.append(button);
          headRow.append(th);
        });
        thead.append(headRow);
        table.append(thead);
        const tbody = element('tbody');
        table.append(tbody);
        wrap.append(table);
        root.append(wrap);

        const pagination = element('div', 'pagination');
        const previous = element('button', 'button', 'Previous');
        const pageLabel = element('span', 'page-label');
        const next = element('button', 'button', 'Next');
        pagination.append(previous, pageLabel, next);
        root.append(pagination);

        const draw = () => {
          const query = state.query.toLowerCase();
          let visibleRows = normalizedRows.filter(row => !query || row.some(cell => asText(cell).toLowerCase().includes(query)));
          if (state.sortColumn !== null) {
            visibleRows = [...visibleRows].sort((left, right) => state.sortDirection * compareValues(left[state.sortColumn], right[state.sortColumn]));
          }
          const pages = Math.max(1, Math.ceil(visibleRows.length / state.pageSize));
          state.page = Math.min(state.page, pages);
          const first = (state.page - 1) * state.pageSize;
          const pageRows = visibleRows.slice(first, first + state.pageSize);
          tbody.replaceChildren();
          pageRows.forEach(row => {
            const tr = element('tr');
            normalizedHeaders.forEach((_, index) => {
              tr.append(renderTableCell(row[index]));
            });
            tbody.append(tr);
          });
          headRow.querySelectorAll('.sort-mark').forEach((mark, index) => {
            mark.textContent = state.sortColumn === index ? (state.sortDirection === 1 ? '▲' : '▼') : '';
          });
          const shownFrom = visibleRows.length ? first + 1 : 0;
          const shownTo = Math.min(first + state.pageSize, visibleRows.length);
          meta.textContent = `${shownFrom}–${shownTo} of ${visibleRows.length} rows`;
          pageLabel.textContent = `Page ${state.page} of ${pages}`;
          previous.disabled = state.page <= 1;
          next.disabled = state.page >= pages;
        };

        search.addEventListener('input', () => { state.query = search.value; state.page = 1; draw(); });
        size.addEventListener('change', () => { state.pageSize = Number(size.value); state.page = 1; draw(); });
        previous.addEventListener('click', () => { state.page -= 1; draw(); });
        next.addEventListener('click', () => { state.page += 1; draw(); });
        draw();
        parent.append(root);
      };

      const renderTables = (parent, item) => {
        const data = item.data;
        const isGrouped = Array.isArray(data)
          && data.length > 0
          && Array.isArray(data[0])
          && typeof data[0][0] === 'string'
          && Array.isArray(data[0][1]);
        if (isGrouped) {
          data.forEach(group => {
            parent.append(element('div', 'comparison-label', asText(group[0])));
            renderTable(parent, item.theader, group[1]);
          });
        } else {
          renderTable(parent, item.theader, data);
        }
      };

      const cssVar = name => getComputedStyle(document.documentElement)
        .getPropertyValue(name)
        .trim();

      const chartTheme = () => ({
        text: cssVar('--text'),
        muted: cssVar('--muted'),
        line: cssVar('--line'),
        lineStrong: cssVar('--line-strong'),
        panelSoft: cssVar('--panel-soft'),
        panel: cssVar('--panel'),
        inputBg: cssVar('--input-bg'),
        accent: cssVar('--accent'),
      });

      const exportTheme = () => ({
        text: '#21182f',
        muted: '#62566f',
        line: '#d7cfdf',
        lineStrong: '#9b8da8',
        panelSoft: '#f6f3f8',
        panel: '#ffffff',
        inputBg: '#ffffff',
        chartBackground: '#ffffff',
        accent: '#6d3fc0',
      });

      const normalizeChartSeries = data => {
        const rawSeries = Array.isArray(data && data.series) ? data.series : [];
        return rawSeries.map((source, sourceIndex) => ({
          name: asText(source && source.name) || `Series ${sourceIndex + 1}`,
          unit: asText(source && source.unit),
          color: source && source.color ? asText(source.color) : '',
          data: (Array.isArray(source && source.data) ? source.data : [])
            .map(point => {
              if (Array.isArray(point)) {
                return {x: point[0], y: point[1] == null ? null : Number(point[1])};
              }
              if (point && typeof point === 'object') {
                const x = point.x ?? point.t;
                const rawY = point.y ?? point.value;
                return {x, y: rawY == null ? null : Number(rawY)};
              }
              return null;
            })
            .filter(point => point && (point.y === null || Number.isFinite(point.y))),
        }));
      };

      const chartColors = series => {
        const defaults = [
          '#efd05f', '#b38ee8', '#84c8e7', '#93d083', '#e98996', '#c7a0ee',
          '#e7a764', '#73d2c5', '#c9ea5f', '#8f9ae8', '#d6b45d', '#aeb4bd',
        ];
        return series.map((source, index) => source.color || defaults[index % defaults.length]);
      };

      const chartKind = data => asText(data && data.chart && data.chart.kind) || 'line';
      const chartSeriesType = data => (
        (data && data.chart && data.chart.type === 'bar')
        || ['bar', 'column', 'stacked_bar', 'stacked_column'].includes(chartKind(data))
      ) ? 'bar' : 'line';
      const chartXType = data => (
        data && data.xaxis && data.xaxis.type === 'datetime' ? 'datetime' : 'category'
      );
      const chartUnit = (data, series) => (
        asText(data && data.chart && data.chart.unit)
        || asText(series.find(source => source.unit)?.unit)
        || asText(data && data.yaxis && data.yaxis.title && data.yaxis.title.text)
      );
      const chartTitle = (data, unit) => {
        const title = asText(data && data.title && data.title.text);
        return unit && !title.endsWith(` [${unit}]`) ? `${title} [${unit}]` : title;
      };
      const chartLegendData = (series, kind) => {
        const names = series.map(source => source.name);
        return ['stacked_bar', 'stacked_column'].includes(kind) ? names.reverse() : names;
      };
      const chartLegendLayout = (entry, legendData) => {
        const containerWidth = Math.max(
          Number(entry.container.clientWidth) || Number(entry.shell.clientWidth) || 0,
          640,
        );
        const width = Math.max(containerWidth - 36, 320);
        let rows = 1;
        let occupied = 0;
        legendData.forEach(name => {
          const estimated = Math.min(width, 48 + Array.from(name).length * 7);
          if (occupied > 0 && occupied + estimated > width) {
            rows += 1;
            occupied = 0;
          }
          occupied += estimated;
        });
        const height = CHART_LEGEND_PADDING_PX + rows * CHART_LEGEND_ROW_HEIGHT_PX;
        return {
          width,
          height,
          chartHeight: Math.max(CHART_MIN_HEIGHT_PX, 68 + CHART_PLOT_MIN_HEIGHT_PX + height + 24),
        };
      };
      const chartBounds = series => {
        const values = series.flatMap(source => source.data)
          .map(point => Date.parse(point.x))
          .filter(Number.isFinite);
        if (!values.length) return {};
        const min = Math.min(...values);
        const max = Math.max(...values);
        const padding = min === max ? 60000 : Math.max(Math.round((max - min) * 0.03), 1000);
        return {min: min - padding, max: max + padding};
      };
      const formatChartTime = value => {
        const timestamp = typeof value === 'number' ? value : Date.parse(value);
        if (!Number.isFinite(timestamp)) return asText(value);
        return [new Date(timestamp).getHours(), new Date(timestamp).getMinutes(), new Date(timestamp).getSeconds()]
          .map(part => String(part).padStart(2, '0'))
          .join(':');
      };
      const formatChartNumber = (value, unit) => {
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) return asText(value);
        const absolute = Math.abs(numeric);
        const digits = absolute >= 100 ? 0 : absolute >= 10 ? 1 : 2;
        return `${numeric.toFixed(digits)}${unit ? ` ${unit}` : ''}`;
      };
      const escapeChartText = value => asText(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
      const safeChartColor = value => {
        const color = asText(value).trim();
        return /^#[0-9a-f]{3,8}$/i.test(color) || /^(?:rgb|hsl)a?\([0-9.,%\s]+\)$/i.test(color)
          ? color
          : 'currentColor';
      };
      const chartTooltip = (params, unit, xType) => {
        const points = Array.isArray(params) ? params : params ? [params] : [];
        if (!points.length) return '';
        const hoveredX = points[0].axisValue ?? (
          Array.isArray(points[0].value) ? points[0].value[0] : points[0].name
        );
        const rows = points.map(point => {
          const rawValue = Array.isArray(point.value) ? point.value[1] : point.value;
          return {
            index: Number(point.seriesIndex) || 0,
            name: point.seriesName,
            value: Number(rawValue),
            color: safeChartColor(point.color),
          };
        }).filter(point => Number.isFinite(point.value))
          .sort((left, right) => right.value - left.value || left.index - right.index)
          .map(point => (
            '<div class="pg-diag-chart-tooltip-row">'
            + `<span class="pg-diag-chart-tooltip-marker" style="background:${point.color}"></span>`
            + `<span class="pg-diag-chart-tooltip-label">${escapeChartText(point.name)}</span>`
            + `<span class="pg-diag-chart-tooltip-value">${escapeChartText(formatChartNumber(point.value, unit))}</span>`
            + '</div>'
          )).join('');
        const title = xType === 'datetime' ? formatChartTime(hoveredX) : asText(hoveredX);
        return '<div class="pg-diag-chart-tooltip">'
          + `<div class="pg-diag-chart-tooltip-title">${escapeChartText(title)}</div>`
          + `<div class="pg-diag-chart-tooltip-rows">${rows}</div>`
          + '</div>';
      };

      const chartOption = (entry, themeOverride = null, exporting = false) => {
        const data = entry.data;
        const series = entry.series;
        const theme = themeOverride || chartTheme();
        const kind = chartKind(data);
        const type = chartSeriesType(data);
        const stacked = ['stacked_bar', 'stacked_column', 'stacked_area'].includes(kind);
        const area = ['area', 'stacked_area'].includes(kind);
        const xType = chartXType(data);
        const unit = chartUnit(data, series);
        const colors = chartColors(series);

            || details.classList.contains('hidden')) {
          cancelDetailsAnimation(details);
          details.open = shouldOpen;
          if (shouldOpen) refreshChartsIn(details);
          requestPageScrollControlsUpdate();
          return;
        }

        cancelDetailsAnimation(details);
        if (shouldOpen) {
          details.classList.add('is-opening');
          details.open = true;
          details.__detailsRaf = requestAnimationFrame(() => {
            details.__detailsRaf = 0;
            details.classList.remove('is-opening');
            details.__detailsTimer = setTimeout(
              () => finishDetailsAnimation(details, true),
              DETAILS_ANIMATION_MS,
            );
          });
          return;
        }

        if (!details.open) {
          finishDetailsAnimation(details, false);
          return;
        }
        details.classList.add('is-closing');
        details.__detailsTimer = setTimeout(
          () => finishDetailsAnimation(details, false),
          DETAILS_ANIMATION_MS,
        );
      };
      const bindAnimatedDetails = () => {
        document.querySelectorAll('details.section, details.report-item').forEach(details => {
          const summary = directSummary(details);
          if (!summary) return;
          summary.addEventListener('click', event => {
            event.preventDefault();
            setDetailsOpen(details, !details.open, true);
          });
        });
      };

      const applyFilters = () => {
        const query = document.getElementById('itemSearch').value.trim().toLowerCase();
        const type = document.getElementById('typeFilter').value;
        let visible = 0;
        document.querySelectorAll('.section').forEach(section => {
          let sectionVisible = 0;
          section.querySelectorAll('.report-item').forEach(item => {
            const matches = (!query || item.dataset.search.includes(query) || section.dataset.search.includes(query))
              && (!type || item.dataset.type === type);
            item.classList.toggle('hidden', !matches);
            if (matches) sectionVisible += 1;
          });
          section.classList.toggle('hidden', sectionVisible === 0);
          if ((query || type) && sectionVisible) setDetailsOpen(section, true, true);
          visible += sectionVisible;
        });
        document.getElementById('filterSummary').textContent = `Showing ${visible} from ${renderedItems}`;
        requestPageScrollControlsUpdate();
      };

      bindAnimatedDetails();
      document.getElementById('itemSearch').addEventListener('input', applyFilters);
      document.getElementById('typeFilter').addEventListener('change', applyFilters);
      document.getElementById('expandAll').addEventListener('click', () => {
        document.querySelectorAll('details:not(.hidden)').forEach(item => {
          setDetailsOpen(item, true, true);
        });
      });
      document.getElementById('collapseAll').addEventListener('click', () => {
        document.querySelectorAll('details').forEach(item => {
          setDetailsOpen(item, false, true);
        });
      });

      const themeToggle = document.getElementById('themeToggle');
      const savedTheme = localStorage.getItem('pg-perf-bench-report-theme');
      const initialTheme = savedTheme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = initialTheme;
      themeToggle.checked = initialTheme === 'light';
      themeToggle.addEventListener('change', () => {
        document.documentElement.dataset.theme = themeToggle.checked ? 'light' : 'dark';
        localStorage.setItem('pg-perf-bench-report-theme', document.documentElement.dataset.theme);
        charts.forEach(item => item.refresh());
      });

      document.getElementById('scrollToTop').addEventListener('click', () => {
        window.scrollTo({top: 0, behavior: scrollBehavior()});
      });
      document.getElementById('scrollToBottom').addEventListener('click', () => {
        window.scrollTo({top: document.documentElement.scrollHeight, behavior: scrollBehavior()});
      });
      document.addEventListener('pointerdown', event => {
        if (!event.target.closest('.chart-export-menu')) closeChartExportMenus();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeChartExportMenus();
      });
      window.addEventListener('scroll', requestPageScrollControlsUpdate, {passive: true});
      document.getElementById('navToggle').addEventListener('click', event => {
        document.body.classList.toggle('nav-collapsed');
        const collapsed = document.body.classList.contains('nav-collapsed');
        event.currentTarget.title = collapsed ? 'Expand contents' : 'Collapse contents';
        event.currentTarget.setAttribute('aria-label', event.currentTarget.title);
        setTimeout(() => charts.forEach(item => item.chart.resize()), 320);
      });
      window.addEventListener('resize', () => {
        charts.forEach(item => item.chart.resize());
        requestPageScrollControlsUpdate();
      });
      if (window.hljs) document.querySelectorAll('pre code').forEach(node => hljs.highlightElement(node));
      applyFilters();
      requestPageScrollControlsUpdate();
    })();
  </script>
</body>
</html>
